<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English (LL) • Std X — Chapters</title>
    <style>
        :root {
            --primary-color: #0052D4;
            --secondary-color: #38B6FF;
            --bg-color: #FFFFFF;
            --text-color: #1D2335;
            --muted-bg: #F0F4F8;
            --white-text: #FFFFFF;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --radius-sm: 12px;
            --radius: 16px;
            --radius-lg: 24px;
            --shadow-sm: 0 2px 8px rgba(29,35,53,0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--muted-bg); color: var(--text-color); min-height: 100vh; }

        /* A. TOP SECTION - Royal Blue Header */
        .app-header {
            background-color: var(--primary-color);
            padding: 28px 24px 64px;
            color: var(--white-text);
            border-bottom-left-radius: var(--radius-lg);
            border-bottom-right-radius: var(--radius-lg);
            position: relative;
        }
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn {
            background: rgba(255,255,255,0.2); color: var(--white-text); border: none;
            width: 40px; height: 40px; border-radius: 50%; font-size: 18px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.35); }
        .header-brand { font-weight: 800; font-size: 18px; letter-spacing: 0.3px; }
        .header-content { margin-top: 8px; }
        .app-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--secondary-color); font-weight: 700; margin-bottom: 6px; }
        .main-heading { font-size: 26px; font-weight: 700; line-height: 1.3; }
        .main-heading small { font-size: 14px; font-weight: 400; opacity: 0.85; display: block; margin-top: 4px; }

        /* Search Bar (on blue bg) */
        .search-container {
            position: absolute;
            bottom: -24px;
            left: 24px;
            right: 24px;
        }
        .search-input {
            width: 100%;
            background: var(--bg-color);
            border: 2px solid var(--muted-bg);
            padding: 14px 20px;
            border-radius: var(--radius);
            font-size: 15px;
            color: var(--text-color);
            box-shadow: 0 6px 16px rgba(0,82,212,0.15);
            outline: none;
        }
        .search-input::placeholder { color: var(--text-muted); }

        /* B. CONTENT BODY */
        .content-body { padding: 48px 20px 32px; max-width: 640px; margin: 0 auto; }

        .section-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .section-title { font-size: 18px; font-weight: 700; color: var(--text-color); }
        .pill-tag {
            background: var(--primary-color); color: var(--white-text);
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
        }

        /* Unit section */
        .unit-block { margin-bottom: 28px; }
        .unit-header { 
            font-size: 15px; font-weight: 700; color: var(--primary-color); 
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }
        .unit-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--secondary-color); }
        .chapters-list { display: flex; flex-direction: column; gap: 10px; }

        /* Chapter Card */
        .chapter-card {
            background: var(--bg-color); border-radius: var(--radius);
            padding: 14px 16px; cursor: pointer; transition: all 0.2s ease;
            border: 1px solid rgba(240,244,248,0.8);
        }
        .chapter-card:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 12px rgba(29,35,53,0.06);
            border-color: var(--secondary-color);
        }
        .card-layout { display: flex; align-items: center; gap: 14px; }
        .card-num {
            width: 40px; height: 40px; flex-shrink: 0;
            background: var(--muted-bg); color: var(--primary-color);
            border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px;
        }
        .chapter-card:hover .card-num { background: var(--primary-color); color: var(--white-text); }
        .card-text { flex: 1; }
        .chapter-title { font-size: 14px; font-weight: 700; color: var(--text-color); line-height: 1.4; }
        .chapter-author { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .card-arrow { color: var(--secondary-color); font-size: 16px; font-weight: 700; }
        .hidden { display: none !important; }

        @media (max-width: 420px) {
            .app-header { padding: 20px 16px 56px; }
            .content-body { padding: 40px 14px 24px; }
            .main-heading { font-size: 22px; }
            .search-container { left: 16px; right: 16px; }
        }
    </style>
</head>
<body>

    <!-- A. TOP SECTION -->
    <header class="app-header">
        <div class="header-nav">
            <button class="back-btn" onclick="goHome()">←</button>
            <span class="header-brand">English (LL)</span>
        </div>
        <div class="header-content">
            <p class="app-title">Std X • Maharashtra Board</p>
            <h1 class="main-heading">English Chapters<br><small>Workshop Questions & Answers</small></h1>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" id="searchBox" placeholder="Search chapters..." onkeyup="searchChapters()">
        </div>
    </header>

    <!-- B. CONTENT BODY -->
    <main class="content-body">
        <div class="section-bar">
            <div class="section-title">All Chapters</div>
            <div class="pill-tag" id="countTag">22 chapters</div>
        </div>

        <div id="chaptersContainer"></div>
    </main>

    <script>
        const chaptersData = [
            // Unit 1
            { unit: "Unit 1", lesson: "1.1", title: "A Teenager's Prayer", author: "J. Morse", file: "Chapter_1_1.html" },
            { unit: "Unit 1", lesson: "1.2", title: "An Encounter of a Special Kind", author: "Tapan Mukherjee", file: "Chapter_1_2.html" },
            { unit: "Unit 1", lesson: "1.3", title: "Basketful of Moonlight", author: "Sunil Sharma", file: "Chapter_1_3.html" },
            { unit: "Unit 1", lesson: "1.4", title: "Be SMART...!", author: "—", file: "Chapter_1_4.html" },
            { unit: "Unit 1", lesson: "1.5", title: "His First Flight", author: "Liam O'Flaherty", file: "Chapter_1_5.html" },
            // Unit 2
            { unit: "Unit 2", lesson: "2.1", title: "You Start Dying Slowly...", author: "Pablo Neruda", file: "Chapter_2_1.html" },
            { unit: "Unit 2", lesson: "2.2", title: "The Boy Who Broke The Bank", author: "Ruskin Bond", file: "Chapter_2_2.html" },
            { unit: "Unit 2", lesson: "2.3", title: "The Twins", author: "Henry Sambrooke Leigh", file: "Chapter_2_3.html" },
            { unit: "Unit 2", lesson: "2.4", title: "An Epitome of Courage", author: "Dr. Stephen Hawking", file: "Chapter_2_4.html" },
            { unit: "Unit 2", lesson: "2.5", title: "Book Review — Swami and Friends", author: "R. K. Narayan", file: "Chapter_2_5.html" },
            { unit: "Unit 2", lesson: "2.6", title: "World Heritage", author: "—", file: "Chapter_2_6.html" },
            // Unit 3
            { unit: "Unit 3", lesson: "3.1", title: "If", author: "Rudyard Kipling", file: "Chapter_3_1.html" },
            { unit: "Unit 3", lesson: "3.2", title: "A Lesson in Life from a Beggar", author: "Sudha Murthy", file: "Chapter_3_2.html" },
            { unit: "Unit 3", lesson: "3.3", title: "Stopping by Woods on a Snowy Evening", author: "Robert Frost", file: "Chapter_3_3.html" },
            { unit: "Unit 3", lesson: "3.4", title: "Let's March!", author: "Kailash Satyarthi", file: "Chapter_3_4.html" },
            { unit: "Unit 3", lesson: "3.5", title: "The Alchemy of Nature", author: "Raksha Bharadia", file: "Chapter_3_5.html" },
            // Unit 4
            { unit: "Unit 4", lesson: "4.1", title: "The World is Mine", author: "Joy Lovelet Crawford", file: "Chapter_4_1.html" },
            { unit: "Unit 4", lesson: "4.2", title: "Bholi", author: "K.A. Abbas", file: "Chapter_4_2.html" },
            { unit: "Unit 4", lesson: "4.3", title: "O Captain! My Captain!", author: "Walt Whitman", file: "Chapter_4_3.html" },
            { unit: "Unit 4", lesson: "4.4", title: "Unbeatable Super Mom — Mary Kom", author: "—", file: "Chapter_4_4.html" },
            { unit: "Unit 4", lesson: "4.5", title: "Joan of Arc", author: "George Bernard Shaw", file: "Chapter_4_5.html" },
            { unit: "Unit 4", lesson: "4.6", title: "A Brave Heart Dedicated to Science and Humanity", author: "Marie Curie", file: "Chapter_4_6.html" }
        ];

        let currentUnit = '';
        function renderChapters(data) {
            const container = document.getElementById('chaptersContainer');
            container.innerHTML = '';
            let count = 0;

            data.forEach(ch => {
                if (ch.unit !== currentUnit) {
                    currentUnit = ch.unit;
                    const unitBlock = document.createElement('div');
                    unitBlock.className = 'unit-block';
                    unitBlock.innerHTML = '<div class="unit-header"><span class="unit-dot"></span>' + ch.unit + '</div><div class="chapters-list"></div>';
                    container.appendChild(unitBlock);
                }
                count++;
                const unitBlock = container.lastElementChild;
                const list = unitBlock.querySelector('.chapters-list');
                const card = document.createElement('div');
                card.className = 'chapter-card';
                card.onclick = function() { window.location.href = ch.file; };
                card.innerHTML = 
                    '<div class="card-layout">' +
                        '<div class="card-num">' + ch.lesson + '</div>' +
                        '<div class="card-text">' +
                            '<div class="chapter-title">' + ch.title + '</div>' +
                            '<div class="chapter-author">' + (ch.author !== '—' ? ch.author : '') + '</div>' +
                        '</div>' +
                        '<div class="card-arrow">→</div>' +
                    '</div>';
                list.appendChild(card);
            });

            document.getElementById('countTag').innerText = count + ' chapter' + (count !== 1 ? 's' : '');
        }

        function searchChapters() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = chaptersData.filter(ch => 
                ch.title.toLowerCase().includes(query) || 
                ch.lesson.includes(query) ||
                ch.author.toLowerCase().includes(query) ||
                ch.unit.toLowerCase().includes(query)
            );
            currentUnit = '';
            renderChapters(filtered);
        }

        function goHome() {
            window.location.href = '../homepagemarathi/marathihome.html';
        }

        window.onload = function() { renderChapters(chaptersData); };
    </script>
</body>
</html>

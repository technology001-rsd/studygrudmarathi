<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0052D4" />
  <title>मराठी १०वी — लॉगिन</title>
  <!-- Module styles -->
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <!-- ============ AUTH BODY (light content area) ============ -->
  <main class="auth-body">
    <section class="auth-card" id="authCard">
      <!-- ============ BRANDING HEADER ============ -->
      <header class="brand-header">
        <h1 class="brand-title">StudyGrid</h1>
        <p class="brand-slogan" id="appSlogan">मराठी — दहावीसाठी ऑफलाइन शिक्षण अॅप</p>
      </header>

      <!-- Tab switcher -->
      <div class="tab-switch" role="tablist" aria-label="प्रवेश प्रकार">
        <button class="tab-switch__btn is-active" id="tabSignup" role="tab" aria-selected="true" data-target="signupPanel">नवीन खाते</button>
        <button class="tab-switch__btn" id="tabLogin" role="tab" aria-selected="false" data-target="loginPanel">लॉगिन</button>
        <span class="tab-switch__slider" id="tabSlider"></span>
      </div>

      <!-- ============ SIGN UP PANEL ============ -->
      <form class="auth-form" id="signupPanel" autocomplete="off" novalidate>
        <div class="field-row">
          <label class="field">
            <span class="field__label">पहिले नाव</span>
            <input class="field__input" type="text" name="firstName" id="su_firstName" required />
          </label>
          <label class="field">
            <span class="field__label">आडनाव</span>
            <input class="field__input" type="text" name="lastName" id="su_lastName" required />
          </label>
        </div>

        <label class="field">
          <span class="field__label">प्रवेश कोड</span>
          <input class="field__input" type="text" name="accessCode" id="su_accessCode" required
                 placeholder="10thmarathifree1" autocomplete="off" />
        </label>

        <button class="btn btn--primary" type="submit">खाते तयार करा</button>
        <p class="form-msg" id="su_msg" role="alert"></p>
      </form>

      <!-- ============ LOGIN PANEL ============ -->
      <form class="auth-form is-hidden" id="loginPanel" autocomplete="off" novalidate>
        <label class="field">
          <span class="field__label">नाव</span>
          <input class="field__input" type="text" name="name" id="li_name" required
                 placeholder="तुझे नाव लिहा" autocomplete="off" />
        </label>

        <label class="field">
          <span class="field__label">प्रवेश कोड</span>
          <input class="field__input" type="text" name="accessCode" id="li_accessCode" required
                 placeholder="10thmarathifree1" autocomplete="off" />
        </label>

        <button class="btn btn--primary" type="submit">लॉगिन</button>
        <p class="form-msg" id="li_msg" role="alert"></p>
      </form>
    </section>
  </main>

  <!-- Module logic -->
  <script src="auth.js"></script>
</body>
</html>

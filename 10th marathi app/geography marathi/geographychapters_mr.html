<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>इयत्ता १०वी भूगोल - प्रकरणे</title>
    <style>
        /* CSS VARIABLES BASED ON STRICT DESIGN SYSTEM */
        :root {
            --primary-color: #0052D4;      /* Royal Blue */
            --secondary-color: #38B6FF;    /* Sky Blue */
            --bg-color: #FFFFFF;           /* White Main Content */
            --text-color: #1D2335;         /* Dark Navy Title/Text */
            --muted-bg: #F0F4F8;           /* Light Blue-Gray Tint Layout */
            --white-text: #FFFFFF;
        }

        /* UNIVERSAL RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--muted-bg);
            color: var(--text-color);
            display: block;
            min-height: 100vh;
        }

        /* SPLIT LAYOUT CONFIGURATION */
        /* A. TOP SECTION (Header Area - Solid Royal Blue) */
        .app-header {
            background-color: var(--primary-color);
            height: 40vh;
            padding: 30px 24px;
            color: var(--white-text);
            position: relative;
            display: block;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
        }

        .header-nav {
            display: block;
            margin-bottom: 24px;
        }
        
        .nav-container {
            display: table;
            width: 100%;
        }
        
        .nav-left, .nav-right {
            display: table-cell;
            vertical-align: middle;
        }
        
        .nav-right {
            text-align: right;
        }

        .profile-btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: var(--white-text);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .header-content {
            margin-top: 20px;
            display: block;
        }

        .app-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary-color);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .main-heading {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 16px;
        }

        .search-container {
            position: absolute;
            bottom: -24px;
            left: 24px;
            right: 24px;
            display: block;
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-color);
            border: 2px solid var(--muted-bg);
            padding: 16px 24px;
            border-radius: 24px;
            font-size: 16px;
            color: var(--text-color);
            box-shadow: 0 8px 16px rgba(0, 82, 212, 0.15);
            outline: none;
        }

        /* B. CONTENT BODY (White/Gray layout) */
        .content-body {
            padding: 48px 24px 24px 24px;
            display: block;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-bar {
            display: table;
            width: 100%;
            margin-bottom: 20px;
        }

        .section-row {
            display: table-row;
        }

        .section-title {
            display: table-cell;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
        }

        .chapter-count-tag {
            display: table-cell;
            text-align: right;
        }

        .pill-tag {
            background-color: var(--primary-color);
            color: var(--white-text);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Chapter Cards & Lists Standard Layout */
        .chapters-list {
            display: block;
        }

        .chapter-card {
            background-color: var(--bg-color);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(29, 35, 53, 0.04);
            cursor: pointer;
            transition: transform 0.2s ease;
            display: block;
            border: 1px solid rgba(240, 244, 248, 0.8);
        }

        .chapter-card:active {
            transform: scale(0.98);
            border-color: var(--secondary-color);
        }

        .card-table {
            display: table;
            width: 100%;
        }

        .card-row {
            display: table-row;
        }

        .card-leading {
            display: table-cell;
            width: 52px;
            vertical-align: middle;
        }

        .icon-square {
            width: 44px;
            height: 44px;
            background-color: var(--muted-bg);
            color: var(--primary-color);
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            line-height: 44px;
        }

        .card-text {
            display: table-cell;
            vertical-align: middle;
            padding: 0 12px;
        }

        .chapter-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .chapter-subtitle {
            font-size: 12px;
            color: #7E8B9B;
            font-weight: 500;
        }

        .card-trailing {
            display: table-cell;
            width: 36px;
            text-align: right;
            vertical-align: middle;
        }

        .action-arrow {
            width: 32px;
            height: 32px;
            background-color: var(--muted-bg);
            border-radius: 50%;
            color: var(--primary-color);
            text-align: center;
            line-height: 32px;
            font-weight: 700;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- A. TOP SECTION (Header Area) -->
    <header class="app-header">
        <div class="header-nav">
            <div class="nav-container">
                <div class="nav-left">
                    <button class="profile-btn" onclick="goHome()">🏠 मुख्यपृष्ठ</button>
                    <span style="font-weight: 800; font-size: 20px; letter-spacing: 0.5px; margin-left: 12px;">अभ्यासक्रम</span>
                </div>
                <div class="nav-right">
                    <button class="profile-btn">मराठी माध्यम</button>
                </div>
            </div>
        </div>
        
        <div class="header-content">
            <p class="app-title">भूगोल विषय सूची</p>
            <h1 class="main-heading">इयत्ता दहावी</h1>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" id="searchBox" placeholder="प्रकरण किंवा शब्द शोधा..." onkeyup="searchChapters()">
        </div>
    </header>

    <!-- B. CONTENT BODY -->
    <main class="content-body">
        <div class="section-bar">
            <div class="section-row">
                <div class="section-title">पाठ्यपुस्तक प्रकरणे</div>
                <div class="chapter-count-tag">
                    <span class="pill-tag" id="countTag">९ पाठ</span>
                </div>
            </div>
        </div>

        <div class="chapters-list" id="chaptersContainer">
            <!-- Dynamic list built with JS -->
        </div>
    </main>

    <script>
        const chaptersData = [
            { id: 1, title: "पाठ १: क्षेत्रभेट", subtitle: "प्रकरण १ • प्रात्यक्षिक भूगोल आणि क्षेत्र अभ्यास" },
            { id: 2, title: "पाठ २: स्थान-विस्तार", subtitle: "प्रकरण २ • भारत व ब्राझील तुलनात्मक भौगोलिक स्थान" },
            { id: 3, title: "पाठ ३: प्राकृतिक रचना व जलप्रणाली", subtitle: "प्रकरण ३ • भूरचना, पर्वत आणि प्रमुख नद्यांचे खोरे" },
            { id: 4, title: "पाठ ४: हवामान", subtitle: "प्रकरण ४ • पर्जन्यमान, तापमान व हवामान बदल" },
            { id: 5, title: "पाठ ५: नैसर्गिक वनस्पती व प्राणी", subtitle: "प्रकरण ५ • वनप्रकार, समृद्ध वनस्पती व वन्यजीव जीवन" },
            { id: 6, title: "पाठ ६: लोकसंख्या", subtitle: "प्रकरण ६ • लोकसंख्या रचना, घनता आणि मानवी संसाधने" },
            { id: 7, title: "पाठ ७: मानवी वस्ती", subtitle: "प्रकरण ७ • वस्त्यांचे प्रकार, नागरीकरण व लोकवस्ती केंद्रीकरण" },
            { id: 8, title: "पाठ ८: अर्थव्यवस्था आणि व्यवसाय", subtitle: "प्रकरण ८ • राष्ट्रीय उत्पन्न, जीडीपी व प्रमुख आर्थिक क्षेत्रे" },
            { id: 9, title: "पाठ ९: पर्यटन, वाहतूक आणि संदेशवहन", subtitle: "प्रकरण ९ • पायाभूत सुविधा, दळणवळण व दळणवळणाची साधने" }
        ];

        function renderChapters(data) {
            const container = document.getElementById('chaptersContainer');
            container.innerHTML = '';
            
            data.forEach(ch => {
                const cardHTML = `
                    <div class="chapter-card" onclick="selectChapter(${ch.id})">
                        <div class="card-table">
                            <div class="card-row">
                                <div class="card-leading">
                                    <div class="icon-square">${ch.id}</div>
                                </div>
                                <div class="card-text">
                                    <div class="chapter-title">${ch.title}</div>
                                    <div class="chapter-subtitle">${ch.subtitle}</div>
                                </div>
                                <div class="card-trailing">
                                    <div class="action-arrow">→</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
            
            document.getElementById('countTag').innerText = `${data.length} पाठ`;
        }

        function searchChapters() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = chaptersData.filter(ch => 
                ch.title.toLowerCase().includes(query) || 
                ch.subtitle.toLowerCase().includes(query)
            );
            renderChapters(filtered);
        }

        function selectChapter(id) {
            window.location.href = 'chapter' + id + '_mr.html';
        }

        function goHome() {
            window.location.href = '../homepagemarathi/marathihome.html';
        }

        window.onload = function() {
            renderChapters(chaptersData);
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सूचना — StudyGrid</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { background: #F0F4F8; height: 100%; margin: 0; padding: 0; display: flex; flex-direction: column; }
        .notif-header {
            background: #0052D4; color: #fff; padding: 16px 20px;
            display: flex; align-items: center; gap: 14px;
            flex-shrink: 0;
        }
        .back-btn {
            background: rgba(255,255,255,0.2); color: #fff; border: none;
            width: 40px; height: 40px; border-radius: 50%; font-size: 18px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.35); }
        .notif-title { font-size: 16px; font-weight: 600; }
        .iframe-wrap { flex: 1; display: flex; min-height: 0; }
        .iframe-wrap iframe {
            width: 100%; height: 100%; border: none;
            background: #fff;
        }
    </style>
</head>
<body>
    <header class="notif-header">
        <button class="back-btn" onclick="goBack()">←</button>
        <span class="notif-title">सूचना</span>
    </header>
    <div class="iframe-wrap">
        <iframe src="https://studygridnotification.blogspot.com/" title="सूचना"></iframe>
    </div>
    <script>
        function goBack() {
            window.location.href = 'marathihome.html';
        }
    </script>
</body>
</html>
